# Runs the tests on every push and every pull request, so a broken change is
# caught before it is merged instead of after it is live.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs exactly what the lock file says, unlike npm install
      - run: npm ci

      - run: npm test
